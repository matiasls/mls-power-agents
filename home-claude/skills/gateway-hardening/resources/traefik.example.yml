# Reference Traefik config (Docker setups). Two documents in this file:
#   1) static config (traefik.yml)
#   2) dynamic config (dynamic.yml) — routers + middlewares
# Split them into separate files when copying into a project.

# --- traefik.yml (static config) ---
api:
  dashboard: false  # NO expongas el dashboard a internet

entryPoints:
  websecure:
    address: ":443"
    http:
      tls:
        options: secure@file
        certResolver: letsencrypt

tls:
  options:
    secure:
      minVersion: VersionTLS12

certificatesResolvers:
  letsencrypt:
    acme:
      email: tu-email@dominio.com
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web

providers:
  docker:
    exposedByDefault: false
  file:
    filename: /etc/traefik/dynamic.yml

---
# --- dynamic.yml (routers + middlewares) ---
http:
  routers:
    scoring-get:
      rule: "Host(`api.tudominio.com`) && PathRegexp(`^/api/v1/scores/[a-zA-Z0-9-]+$`) && Method(`GET`)"
      service: scoring-service
      middlewares:
        - security-headers
        - rate-limit-read
        - jwt-auth

  middlewares:
    security-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: "strict-origin-when-cross-origin"

    rate-limit-read:
      rateLimit:
        average: 60
        burst: 10
        period: 1m

    jwt-auth:
      forwardAuth:
        address: "http://auth-service:8080/validate"
